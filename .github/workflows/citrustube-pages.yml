name: Publicar CitrusTube no GitHub Pages

on:
  push:
    branches:
      - citrustube-prototype
    paths:
      - "citrustube/**"
      - ".github/workflows/citrustube-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-citrustube"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "citrustube"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar CitrusTube
        id: deployment
        uses: actions/deploy-pages@v4
